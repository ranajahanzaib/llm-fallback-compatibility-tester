[package]
name = "llm-fallback-compatibility-tester"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Behavioral compatibility testing for AI provider failover"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ranajahanzaib/llm-fallback-compatibility-tester"
keywords = ["llm", "testing", "reliability", "fallback", "ai"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = [
  "PLAN.md",
  "runs/**",
  "**/__pycache__/**",
  "**/*.pyc",
]

[lib]
name = "llm_fallback_compatibility_tester"
path = "src/lib.rs"

[[bin]]
name = "llm-fallback-compatibility-tester"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jsonschema = "0.33"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

