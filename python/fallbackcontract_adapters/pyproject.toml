[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-fallback-compatibility-tester-adapters"
version = "0.1.0"
description = "Optional local model adapters for LLM Fallback Compatibility Tester"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rana Jahanzaib" }]
keywords = ["llm", "ollama", "provider-adapter", "fallback-compatibility"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ranajahanzaib/llm-fallback-compatibility-tester"
Repository = "https://github.com/ranajahanzaib/llm-fallback-compatibility-tester"
Issues = "https://github.com/ranajahanzaib/llm-fallback-compatibility-tester/issues"

[project.scripts]
llm-fallback-compatibility-tester-python-adapter = "fallbackcontract_adapters.protocol:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fallbackcontract_adapters"]
