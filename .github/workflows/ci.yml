name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python adapter package
        run: python -m pip install ./python/fallbackcontract_adapters
      - run: cargo test --workspace
      - name: Test Python protocol
        run: PYTHONPATH=python/fallbackcontract_adapters/src python -m unittest discover -s python/fallbackcontract_adapters/tests -v
      - name: Compile Python package
        run: python -m compileall -q python/fallbackcontract_adapters/src
      - run: ./scripts/demo.sh
